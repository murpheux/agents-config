#:schema https://developers.openai.com/codex/config-schema.json
# ~/.codex/config.toml — OpenAI Codex CLI (0.167.x) global configuration (Murpheux)
# Rendered by install.sh (__HOME__ → your home). Validate with:  codex --strict-config doctor
# Codex reads $CODEX_HOME (default ~/.codex) — if CODEX_HOME points elsewhere, none of this loads.
# Tier profiles live in separate files: cheap.config.toml, deep.config.toml, audit.config.toml,
# gateway.config.toml → `codex --profile <name>` layers $CODEX_HOME/<name>.config.toml on top.
# Keep every top-level key ABOVE the first [table]: TOML puts keys after a header inside that table.

# ── Models / cost ─────────────────────────────────────────────────────────────────────────
model_provider = "scarlet"              # Agentgateway is the default; `codex login` (OpenAI) is not used
model = "gpt-6.1-sol"                   # workhorse main thread (router + NORMAL work); gateway has no gpt-6-sol
# Codex can't decode the gateway's OpenAI-style /v1/models, so the picker uses this static catalog
# (generated by install.sh from the installed Codex's bundled metadata, gateway models only).
model_catalog_json = "__HOME__/.codex/model-catalog.json"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"                 # shorter answers = fewer output tokens
review_model = "gpt-6-luna"             # /review on the cheap tier
model_auto_compact_token_limit = 180000
tool_output_token_limit = 12000         # cap tool output fed back to the model
project_doc_max_bytes = 65536           # default 32 KiB would truncate ~/.codex/AGENTS.md + project files
project_doc_fallback_filenames = ["CLAUDE.md"]

# ── Safety ────────────────────────────────────────────────────────────────────────────────
approval_policy = "on-request"
sandbox_mode = "workspace-write"
allow_login_shell = false
web_search = "disabled"                 # hosted web search is an OpenAI-only tool; not available via the gateway
file_opener = "vscode"

# ── Subagents (custom agents: $CODEX_HOME/agents/*.toml) ────────────────────────────────
[agents]
default_subagent_model = "gpt-6-luna"   # any unnamed helper spawns on the cheap tier
default_subagent_reasoning_effort = "high"
max_concurrent_threads_per_session = 4
max_depth = 1

[sandbox_workspace_write]
network_access = false                  # commands needing network ask for approval (sre agent enables it)
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false         # keep the built-in *KEY* / *SECRET* / *TOKEN* excludes
set = { DOTNET_CLI_TELEMETRY_OPTOUT = "1", GIT_PAGER = "cat", PAGER = "cat" }

[shell_environment_policy.filters]
"OP_SESSION_*" = "exclude"
"OP_SERVICE_ACCOUNT_TOKEN" = "exclude"
"*PASSWORD*" = "exclude"
"*_PAT" = "exclude"
"*CREDENTIAL*" = "exclude"
"AGENTGATEWAY_*" = "exclude"
"OPENROUTER_*" = "exclude"
"AWS_SECRET_ACCESS_KEY" = "exclude"
"AWS_SESSION_TOKEN" = "exclude"

# ── Guard hook (same guardrails.json as every other agent config) ───────────────────────
# New/changed hooks must be trusted once in the TUI: /hooks
[[hooks.PreToolUse]]
matcher = "^(Bash|shell|local_shell|apply_patch|Edit|Write)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 __HOME__/.codex/hooks/guard.py --format codex"
timeout = 15
statusMessage = "Guardrails check"

# ── UI ────────────────────────────────────────────────────────────────────────────────────
[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "unfocused"

# ── Providers (scarlet = default via model_provider above; openrouter is opt-in) ─────────
# TLS: leave CODEX_CA_CERTIFICATE/SSL_CERT_FILE-style overrides unset for Codex. The macOS
# platform verifier trusts the home-lab CA from the keychain; a custom bundle replaces it and
# the gateway handshake then fails ("Connection failed: error sending request").
[model_providers.scarlet]
name = "Agentgateway on scarlet"
base_url = "https://scarlet:9443/v1"
wire_api = "responses"                  # Codex only speaks the Responses API ("chat" is a hard error)
request_max_retries = 4
stream_max_retries = 5
stream_idle_timeout_ms = 300000

[model_providers.scarlet.auth]          # Codex runs this itself; the token never enters model context
command = "op"
args = ["read", "op://private/agent-gateway-api-key/password"]   # same item as AGENTGATEWAY_API_KEY in ~/.zshrc
timeout_ms = 30000                      # 5 s timed out while 1Password waited for approval → 401
refresh_interval_ms = 300000

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"

# ── MCP servers (read-mostly; outputs capped) ───────────────────────────────────────────
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT"
http_headers = { "X-MCP-Toolsets" = "repos,issues,pull_requests,actions,code_security", "X-MCP-Readonly" = "true" }
default_tools_approval_mode = "auto"    # read-only server
tool_timeout_sec = 60

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
env_http_headers = { "CONTEXT7_API_KEY" = "CONTEXT7_API_KEY" }
default_tools_approval_mode = "auto"

[mcp_servers.mslearn]
url = "https://learn.microsoft.com/api/mcp"
default_tools_approval_mode = "auto"

[mcp_servers.awsdocs]
command = "uvx"
args = ["awslabs.aws-documentation-mcp-server@latest"]
env = { FASTMCP_LOG_LEVEL = "ERROR", AWS_DOCUMENTATION_PARTITION = "aws" }
startup_timeout_sec = 30
default_tools_approval_mode = "auto"

[mcp_servers.terraform]
command = "docker"
args = ["run", "-i", "--rm", "hashicorp/terraform-mcp-server"]
startup_timeout_sec = 30
default_tools_approval_mode = "auto"
